<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US daily weather, 2025: millions of rows, all in your browser</title>
    <meta
      name="description"
      content="Every 2025 daily reading from US weather stations, 8.7 million station-days, queried in the browser. DuckDB-Wasm reads a Parquet file in byte ranges and Lattice Grid turns every filter, sort, group and chart into SQL. No backend. NOAA GHCN-Daily, public domain."
    />
    <link rel="icon" href="data:," />
    <script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
    <!-- The one place the grid version lives: BASE and STAMP. The import map gives the modules
         bare names (main.js imports them; the calendar module imports the charts module by its
         package name), and the stylesheet is added from the same BASE. -->
    <script>
      (function () {
        var BASE = 'https://cdn.latticegrid.dev/lattice-grid@1.123.3/';
        var STAMP = '?v=1.123.3-20261116';
        var map = document.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({ imports: {
          'lattice-grid': BASE + 'lattice-grid.esm.min.js' + STAMP,
          '@toclocoinc/lattice-grid/modules/charts': BASE + 'modules/charts.esm.min.js' + STAMP,
          'lattice-grid/modules/chart-calendar': BASE + 'modules/chart-calendar.esm.min.js' + STAMP
        } });
        document.head.appendChild(map);
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = BASE + 'lattice-grid.min.css' + STAMP;
        document.head.appendChild(css);
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>US daily weather, 2025</h1>
        <div class="load-status" role="status" aria-live="polite">
          <span class="spinner"></span>
          <p class="load-text">Starting. The first visit downloads the query engine, so it takes a moment.</p>
          <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><div class="load-fill"></div></div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
